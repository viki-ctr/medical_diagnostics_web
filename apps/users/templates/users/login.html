{% extends "users/base_account.html" %}

{% block account_title %}Вход в систему{% endblock %}

{% block account_content %}
<form method="post">
    {% csrf_token %}
    {% include "users/includes/form_errors.html" %}

    <div class="mb-3">
        <label for="id_username" class="form-label">Логин</label>
        <input type="text" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="id_password" class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Войти</button>

    <div class="mt-3 text-center">
        <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
    </div>
</form>
{% endblock %}
