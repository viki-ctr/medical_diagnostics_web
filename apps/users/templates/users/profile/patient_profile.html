{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card">
        <div class="card-header">
            <h3>Профиль пациента</h3>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% include "users/includes/form_errors.html" %}

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Дата рождения</label>
                        {{ form.date_of_birth }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Пол</label>
                        {{ form.gender }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Адрес</label>
                    {{ form.address }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    {{ form.phone }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Медицинская история</label>
                    {{ form.medical_history }}
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
