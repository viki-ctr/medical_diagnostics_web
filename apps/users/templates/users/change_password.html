{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Смена пароля</h2>
                    
                    <form id="changePasswordForm">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="old_password" class="form-label">Текущий пароль</label>
                            <input type="password" class="form-control" id="old_password" name="old_password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="new_password" class="form-label">Новый пароль</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="new_password2" class="form-label">Подтверждение пароля</label>
                            <input type="password" class="form-control" id="new_password2" name="new_password2" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Сменить пароль</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('access_token');
    const formData = new FormData(e.target);
    
    if (formData.get('new_password') !== formData.get('new_password2')) {
        alert('Пароли не совпадают');
        return;
    }
    
    try {
        const response = await fetch('/api/users/change-password/', {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                old_password: formData.get('old_password'),
                new_password: formData.get('new_password'),
                new_password2: formData.get('new_password2')
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            alert('Пароль успешно изменен');
            window.location.href = "{% url 'users:profile' %}";
        } else {
            alert(data.old_password || data.new_password || 'Ошибка смены пароля');
        }
    } catch (error) {
        console.error('Error:', error);
    }
});
</script>
{% endblock %}
