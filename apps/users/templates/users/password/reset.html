{% extends "users/base_account.html" %}

{% block account_title %}Сброс пароля{% endblock %}

{% block account_content %}
<form method="post">
    {% csrf_token %}
    {% include "users/includes/form_errors.html" %}
    
    <div class="mb-3">
        <label for="id_email" class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    
    <button type="submit" class="btn btn-primary w-100">Отправить ссылку для сброса</button>
    
    <div class="mt-3 text-center">
        <a href="{% url 'users:login' %}">Вернуться к входу</a>
    </div>
</form>
{% endblock %}
