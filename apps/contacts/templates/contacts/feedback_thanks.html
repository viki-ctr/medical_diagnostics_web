{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4><i class="bi bi-check-circle"></i> Спасибо за ваш отзыв!</h4>
                </div>

                <div class="card-body">
                    <p class="lead">Мы получили ваше сообщение и свяжемся с вами в ближайшее время.</p>
                    <p>Ваше мнение очень важно для нас.</p>

                    <div class="mt-4">
                        <a href="{% url 'contacts:contact-info' %}" class="btn btn-primary">
                            Вернуться на страницу контактов
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
