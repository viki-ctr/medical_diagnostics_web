<div class="col-md-6">
    <div class="card h-100">
        <div class="card-body">
            <h5 class="card-title">{{ branch.name }}</h5>
            <p class="card-text">
                <i class="fas fa-map-marker-alt"></i> {{ branch.address }}<br>
                <i class="fas fa-phone"></i> {{ branch.phone }}
            </p>
            {% if branch.work_hours %}
            <p class="card-text"><small class="text-muted">{{ branch.work_hours }}</small></p>
            {% endif %}
        </div>
    </div>
</div>
