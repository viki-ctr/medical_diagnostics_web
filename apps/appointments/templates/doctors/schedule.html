{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Расписание доктора {{ doctor.user.get_full_name }}</h2>
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Рабочие дни:</label><br>
            {% for day in form.working_days.field.choices %}
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="working_days"
                       id="day{{ day.0 }}" value="{{ day.0 }}"
                       {% if day.0 in form.working_days.value %}checked{% endif %}>
                <label class="form-check-label" for="day{{ day.0 }}">{{ day.1 }}</label>
            </div>
            {% endfor %}
        </div>

        <div class="form-group">
            <label for="working_hours_start">Начало рабочего дня:</label>
            <input type="time" class="form-control" name="working_hours_start"
                   value="{{ form.working_hours.value.start|default:'09:00' }}">
        </div>

        <div class="form-group">
            <label for="working_hours_end">Конец рабочего дня:</label>
            <input type="time" class="form-control" name="working_hours_end"
                   value="{{ form.working_hours.value.end|default:'18:00' }}">
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
